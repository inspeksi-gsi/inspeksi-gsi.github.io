<style>
  :root {
    --kuning: #F6B800;
    --grafit: #23262A;
    --baja: #E4E8EB;
    --garis: #C3CAD0;
    --abu: #565E66;
    --putih: #FFFFFF;
    --hijau: #0B7A4B;
    --merah: #B62A17;
    --judul: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --isi: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--baja);
    color: var(--grafit);
    font: 400 16px/1.45 var(--isi);
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  body.adaNav { padding-bottom: calc(82px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--grafit); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wadah { max-width: 520px; margin: 0 auto; }

  /* Kepala */
  header { background: var(--kuning); }
  .kepala { padding: 16px 16px 14px; }
  h1 { font: 700 32px/1.05 var(--judul); margin: 0; }
  .sub { margin: 3px 0 0; font-weight: 500; }
  .judul-kepala { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .judul-kepala > div:first-child { min-width: 0; }
  .logo { display: flex; align-items: center; gap: 10px; flex: none; padding: 6px 10px; background: var(--putih); border-radius: 8px; }
  .logo img { display: block; height: 44px; width: auto; }
  @media (max-width: 350px) { .logo { gap: 6px; padding: 5px 7px; } .logo img { height: 36px; } }
  .strip {
    height: 8px;
    background: repeating-linear-gradient(-45deg, var(--grafit) 0 12px, var(--kuning) 12px 24px);
  }
  .demo {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 10px;
    background: var(--grafit); color: var(--putih);
    font-size: 14px; padding: 7px 16px; text-align: center;
  }
  .demo button { min-height: 32px; padding: 0 4px; background: none; border: 0; color: var(--kuning); font-weight: 600; text-decoration: underline; }
  .label { display: block; font-weight: 600; margin-bottom: 5px; }
  .kepala .label { margin-top: 12px; }
  input, textarea {
    width: 100%; min-height: 50px; padding: 10px 12px;
    background: var(--putih); border: 2px solid var(--grafit); border-radius: 6px;
  }
  textarea { min-height: 84px; resize: vertical; }
  #nama { font-weight: 600; }

  main { padding: 14px 12px 16px; }
  .cari { margin-bottom: 12px; }
  .cari input { border-color: var(--garis); }

  /* Kartu unit dengan tiga lubang pons */
  .daftar { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .kartu {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
    padding: 11px 14px; background: var(--putih); text-align: left;
    border: 0; border-left: 6px solid var(--garis); border-radius: 6px;
  }
  button.kartu:active { background: #FFF4CC; }
  .kartu.tercapai { border-left-color: var(--hijau); }
  .kartu.sudah { opacity: .72; }
  .kode { font: 700 28px/1.05 var(--judul); overflow-wrap: anywhere; }
  .ket { grid-column: 1 / -1; font-size: 14px; color: var(--abu); }

  .lubang { display: flex; gap: 7px; }
  .lubang i {
    width: 24px; height: 24px; border-radius: 50%; display: block;
    border: 2px dashed #8A939B; background: transparent;
  }
  .lubang i.isi { border: 2px solid var(--grafit); background: var(--grafit); box-shadow: inset 0 2px 3px #000; }
  .tercapai .lubang i.isi { border-color: var(--hijau); background: var(--hijau); box-shadow: inset 0 2px 3px #04492c; }
  .lubang i.baru { animation: pons .4s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pons { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .lebih { font: 600 15px/24px var(--judul); color: var(--hijau); }

  .kosong { padding: 22px 16px; background: var(--putih); border-radius: 6px; }
  .kosong p { margin: 0; }

  /* Admin */
  .masuk { padding: 16px; background: var(--putih); border-radius: 6px; }
  .masuk p { margin: 0 0 12px; }
  .masuk .tombol { margin-top: 12px; }
  .tombol {
    display: block; width: 100%; min-height: 54px; padding: 15px 12px; text-align: center; text-decoration: none;
    background: var(--kuning); color: var(--grafit); border: 0; border-radius: 6px;
    font: 700 22px/1.1 var(--judul);
  }
  .tombol:disabled { opacity: .55; cursor: default; }
  .tombol.kedua { background: var(--putih); border: 2px solid var(--grafit); padding: 13px 12px; }
  .bulan { display: grid; grid-template-columns: 50px 1fr 50px; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bulan button {
    min-height: 50px; background: var(--putih); border: 2px solid var(--grafit); border-radius: 6px;
    font-size: 22px; font-weight: 600;
  }
  .bulan button:disabled { opacity: .35; cursor: default; }
  .bulan strong { font: 700 24px/1.1 var(--judul); text-align: center; }
  .capaian { background: var(--grafit); color: var(--putih); padding: 14px 16px; border-radius: 6px; margin-bottom: 12px; }
  .capaian b { display: block; font: 700 32px/1.1 var(--judul); }
  .capaian span { color: #D5DADF; }
  .batang { height: 10px; margin-top: 10px; background: #474C52; border-radius: 5px; overflow: hidden; }
  .batang div { height: 100%; background: var(--kuning); }
  .saring { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .saring button {
    min-height: 44px; background: transparent; border: 2px solid var(--garis); border-radius: 6px; font-weight: 600;
  }
  .saring button[aria-pressed=true] { background: var(--kuning); border-color: var(--kuning); }
  h2 { font: 700 23px/1.1 var(--judul); margin: 22px 0 8px; }
  details.kartu { display: block; padding: 0; }
  details.kartu summary {
    list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
    align-items: center; padding: 11px 14px; cursor: pointer;
  }
  details.kartu summary::-webkit-details-marker { display: none; }
  .rincian { margin: 0; padding: 0 14px 10px; list-style: none; border-top: 1px solid var(--baja); }
  .rincian li { padding: 8px 0; border-bottom: 1px solid var(--baja); }
  .rincian li:last-child { border-bottom: 0; }
  .rincian b { font-weight: 600; }
  .rincian small { display: block; font-size: 14px; color: var(--abu); }
  .orang { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 11px 14px; background: var(--putih); border-radius: 6px; }
  .orang b { font-weight: 600; overflow-wrap: anywhere; }

  .tautan { display: grid; gap: 8px; margin-bottom: 14px; }
  .linkApp { padding: 12px 14px; background: var(--putih); border-radius: 6px; }
  .linkApp code { display: block; margin-bottom: 8px; font-family: var(--isi); font-size: 14px; color: var(--abu); overflow-wrap: anywhere; user-select: all; }
  .jumlah { margin: 0 0 8px; font-weight: 600; }
  .baris { padding: 10px 14px; background: var(--putih); border-radius: 6px; border-left: 6px solid var(--garis); }
  .baris-atas { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .baris-atas .kode { font-size: 24px; }
  .baris-atas time { font-size: 14px; color: var(--abu); white-space: nowrap; }
  .baris p { margin: 2px 0 0; overflow-wrap: anywhere; }
  .baris .nama { font-weight: 600; }
  .aksi { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .aksi span { font-weight: 600; }
  .aksi button { min-height: 42px; padding: 0 14px; background: none; border: 2px solid var(--garis); border-radius: 6px; font-weight: 600; }
  .aksi button.hapus { color: var(--merah); border-color: var(--merah); }
  .aksi button.yakin { background: var(--merah); border-color: var(--merah); color: var(--putih); }
  .aksi button.simpan { background: var(--kuning); border-color: var(--kuning); }
  .form-edit { width: 100%; display: grid; gap: 10px; }
  .form-edit .label { margin: 0; }
  .form-edit input, .form-edit select, .form-edit textarea { width: 100%; margin-top: 5px; font-weight: 400; }
  .form-edit select { min-height: 50px; padding: 10px 12px; background: var(--putih); border: 2px solid var(--grafit); border-radius: 6px; }
  .form-edit .salah { margin: 0; }
  .tombol-edit { display: flex; flex-wrap: wrap; gap: 8px; }
  .aksi button:disabled { opacity: .55; cursor: default; }
  .baris .kecil { font-size: 14px; color: var(--abu); }

  .capaian-utama { display: grid; grid-template-columns: auto 1fr; gap: 2px 18px; align-items: center; margin-bottom: 14px; }
  .capaian-utama .batang { grid-column: 1 / -1; }
  .persen { font: 700 76px/1 var(--judul); color: var(--kuning); }
  .kepala-kelompok { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 2px; }
  .kepala-kelompok h2 { margin: 0; overflow-wrap: anywhere; }
  .kepala-kelompok span { font: 700 21px/1.1 var(--judul); white-space: nowrap; }
  .kepala-kelompok > div { min-width: 0; }
  .kepala-kelompok small { display: block; margin-top: 2px; font: 500 13px/1.2 var(--isi); color: var(--abu); }
  .kelompok { min-width: 0; }
  #daftarDisplay { align-items: start; gap: 8px 14px; }
  .kelompok-admin { margin-top: 14px; }
  .baris-tambah { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .baris-tambah .tombol { width: auto; min-height: 50px; padding: 0 18px; }
  .baris-posisi { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; padding: 8px 12px; background: var(--putih); border-radius: 6px; }
  .baris-posisi select { width: 100%; min-height: 48px; padding: 8px 10px; background: var(--putih); border: 2px solid var(--grafit); border-radius: 6px; }
  .hapus-posisi { min-height: 40px; padding: 0 12px; background: none; border: 2px solid var(--merah); color: var(--merah); border-radius: 6px; font-weight: 600; }
  #navAdmin .wadah { grid-template-columns: repeat(3, 1fr); }
  .capaian-utama b { font-size: 24px; }
  .capaian-utama span { display: block; }
  /* Display */
  body.modeLebar .wadah { max-width: 1200px; }
  .bantuan { margin: 0 0 10px; font-size: 15px; color: var(--abu); }
  #bagikanAdmin { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
  #bagikanAdmin svg { width: 22px; height: 22px; flex: none; }
  .diperbarui { margin: 10px 0 0; font-size: 14px; color: var(--abu); }
  .baris-unit {
    display: grid; grid-template-columns: 60px 1fr auto; gap: 8px; align-items: center;
    padding: 9px 12px; background: var(--putih); border-left: 6px solid var(--garis); border-radius: 6px;
  }
  .baris-unit.tercapai { border-left-color: var(--hijau); }
  .slot { display: flex; gap: 6px; align-items: center; }
  .slot b {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 2px dashed #8A939B; font: 700 21px/1 var(--judul);
  }
  .slot b.isi { border: 2px solid var(--grafit); background: var(--grafit); color: var(--putih); }
  .tercapai .slot b.isi { border-color: var(--hijau); background: var(--hijau); }

<script>
(function () {
  'use strict';

  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var API_URL = 'https://script.google.com/macros/s/AKfycbzhgmFzfMVkWczu_imv2BqSX_fXNxcbp3uIo4Mh27vmfEQtuGxnU6poC_K8rlp18Y9P/exec';
  var PAKAI_GOOGLE = !!(window.google && google.script && google.script.run);
  var DEMO = !PAKAI_GOOGLE && !API_URL;
  var KUNCI_NAMA = 'inspeksiUnit.nama';

  var data = null;        // halaman mekanik
  var dataAdmin = null;   // halaman admin
  var password = '';
  var bulanAdmin = '';
  var saring = 'belum';
  var unitTerbuka = null;
  var modeTampil = 'mekanik';
  var dataDisplay = null;
  var bulanDisplay = '';
  var saringDisplay = 'semua';
  var lubangBaru = '';
  var timerPesan = 0;
  var modeAdmin = false;

  var $ = function (id) { return document.getElementById(id); };

  // ---------- Sambungan ke server ----------
  function panggil(fungsi, argumen) {
    if (DEMO) return Promise.resolve(contoh[fungsi](argumen));
    if (!PAKAI_GOOGLE) {
      // credentials omit: permintaan tidak membawa akun Google yang login di HP.
      return fetch(API_URL, {
        method: 'POST',
        credentials: 'omit',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fungsi, arg: argumen })
      }).then(function (r) {
        if (!r.ok) throw new Error('Server tidak merespons. Coba lagi sebentar lagi.');
        return r.json();
      }, function () {
        throw new Error('Data gagal dimuat. Periksa sinyal, lalu buka ulang halaman ini.');
      }).then(function (h) {
        if (h && h.error) throw new Error(h.error);
        return h;
      });
    }
    return new Promise(function (berhasil, gagal) {
      var run = google.script.run.withSuccessHandler(berhasil).withFailureHandler(gagal);
      if (argumen === undefined) run[fungsi](); else run[fungsi](argumen);
    });
  }

  // ---------- Hitungan ----------
  /** Satu tanggal dihitung satu inspeksi, walau dua mekanik menginput unit yang sama. */
  function ringkas(d) {
    var per = {};
    d.units.forEach(function (u) { per[u] = { unit: u, tanggal: {}, baris: [] }; });
    d.records.forEach(function (r) {
      var p = per[r.unit];
      if (!p) return;
      p.tanggal[r.date] = true;
      p.baris.push(r);
    });
    return d.units.map(function (u) {
      var p = per[u];
      p.jumlah = Object.keys(p.tanggal).length;
      p.tercapai = p.jumlah >= d.target;
      return p;
    });
  }

  function rapikanNama(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase()
      .replace(/(^|[\s'-])\S/g, function (h) { return h.toUpperCase(); });
  }
  function samaNama(a, b) { return rapikanNama(a) === rapikanNama(b); }
  function urutKode(a, b) { return a.localeCompare(b, 'id', { numeric: true }); }
  function hariBulan(tgl) { return Number(tgl.slice(8, 10)); }
  function tanggalPanjang(tgl) { return hariBulan(tgl) + ' ' + BULAN[Number(tgl.slice(5, 7)) - 1]; }
  function labelBulan(b) { return BULAN[Number(b.slice(5, 7)) - 1] + ' ' + b.slice(0, 4); }
  function geserBulan(b, n) {
    var y = Number(b.slice(0, 4)), m = Number(b.slice(5, 7)) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + String(m + 1).padStart(2, '0');
  }

  function buat(tag, kelas, isi) {
    var el = document.createElement(tag);
    if (kelas) el.className = kelas;
    if (isi !== undefined) el.textContent = isi;
    return el;
  }

  function kartuKosong(teks) {
    var li = buat('li', 'kosong');
    li.appendChild(buat('p', '', teks));
    return li;
  }

  function buatLubang(p, target, kode) {
    var w = buat('span', 'lubang');
    w.setAttribute('role', 'img');
    w.setAttribute('aria-label', p.jumlah + ' dari ' + target + ' inspeksi');
    for (var i = 0; i < target; i++) {
      var o = buat('i', i < p.jumlah ? 'isi' : '');
      if (kode && kode === p.unit && i === p.jumlah - 1) o.classList.add('baru');
      w.appendChild(o);
    }
    if (p.jumlah > target) w.appendChild(buat('span', 'lebih', '+' + (p.jumlah - target)));
    return w;
  }

  // ---------- Halaman mekanik ----------
  function tampilkanAbsen() {
    if (!data) return;
    var kata = $('cari').value.trim().toLowerCase();
    var nama = $('nama').value;
    var daftar = ringkas(data).filter(function (p) {
      return !kata || p.unit.toLowerCase().indexOf(kata) >= 0;
    });
    daftar.sort(function (a, b) {
      return (a.tercapai - b.tercapai) || (a.jumlah - b.jumlah) || urutKode(a.unit, b.unit);
    });

    var ul = $('daftarUnit');
    ul.textContent = '';
    daftar.forEach(function (p) {
      var hariIni = p.baris.filter(function (r) { return r.date === data.today; });
      var sudahSaya = rapikanNama(nama).length > 1 && hariIni.some(function (r) { return samaNama(r.mech, nama); });
      var li = buat('li');
      var k = buat('button', 'kartu');
      k.type = 'button';
      if (p.tercapai) k.classList.add('tercapai');
      if (sudahSaya) k.classList.add('sudah');
      k.appendChild(buat('span', 'kode', p.unit));
      k.appendChild(buatLubang(p, data.target, lubangBaru));

      var ket = '';
      if (sudahSaya) ket = 'Anda sudah input hari ini';
      else if (hariIni.length) ket = 'Sudah diinspeksi hari ini';
      else if (p.tercapai) ket = 'Target bulan ini tercapai';
      if (ket) k.appendChild(buat('span', 'ket', ket));

      k.addEventListener('click', function () { bukaLembar(p); });
      li.appendChild(k);
      ul.appendChild(li);
    });
    lubangBaru = '';

    if (!daftar.length) {
      ul.appendChild(kartuKosong(data.units.length
        ? 'Unit tidak ditemukan. Periksa kode yang dicari.'
        : 'Belum ada unit. Isi daftar unit di sheet Unit.'));
    }
  }

  function bukaLembar(p) {
    var nama = rapikanNama($('nama').value);
    if (nama.length < 2) {
      tampilkanPesan('Tulis nama Anda dulu.', true);
      window.scrollTo(0, 0);
      $('nama').focus();
      return;
    }
    unitTerbuka = p.unit;
    $('judulUnit').textContent = p.unit;
    $('hm').value = '';
    $('catatan').value = '';
    $('salah').hidden = true;

    $('tanggal').min = data.minDate;
    $('tanggal').max = data.today;
    $('tanggal').value = data.today;
    perbaruiInfo();
    $('labelHm').textContent = data.requireHm ? 'HM unit' : 'HM unit (boleh kosong)';
    $('lembar').showModal();
  }

  /** Pesan di form mengikuti tanggal yang sedang dipilih. */
  function perbaruiInfo() {
    var p = ringkas(data).filter(function (x) { return x.unit === unitTerbuka; })[0];
    var tgl = $('tanggal').value;
    var sama = p.baris.filter(function (r) { return r.date === tgl; });
    var info = '';
    $('salah').hidden = true;
    if (sama.some(function (r) { return samaNama(r.mech, $('nama').value); })) {
      tampilkanSalah('Anda sudah input inspeksi unit ' + p.unit + ' tanggal ' + tanggalPanjang(tgl) + '. Pilih tanggal lain.');
    } else if (sama.length) {
      info = (sama[0].mech || 'Mekanik lain') + ' sudah input inspeksi unit ini pada tanggal itu. Data Anda ikut tercatat, hitungan unit tetap 1 inspeksi.';
    } else if (p.tercapai) {
      info = 'Unit ini sudah ' + p.jumlah + 'x bulan ini. Data tetap dicatat.';
    }
    $('infoForm').textContent = info;
    $('infoForm').hidden = !info;
  }

  function tampilkanSalah(teks) {
    $('salah').textContent = teks;
    $('salah').hidden = false;
  }

  function kirim(e) {
    e.preventDefault();
    var hm = $('hm').value.trim();
    var catatan = $('catatan').value.trim();
    var tanggal = $('tanggal').value;
    if (!tanggal) { tampilkanSalah('Pilih tanggal inspeksi.'); $('tanggal').focus(); return; }
    if (data.requireHm && !hm) { tampilkanSalah('Isi HM unit.'); $('hm').focus(); return; }

    var unit = unitTerbuka;
    var tombol = $('simpan');
    tombol.disabled = true;
    tombol.textContent = 'Menyimpan…';
    $('salah').hidden = true;

    panggil('submitAbsen', {
      mekanik: $('nama').value, unit: unit, tanggal: tanggal, hm: hm, catatan: catatan
    }).then(function (hasil) {
      if (!hasil.ok) { tampilkanSalah(hasil.message); return; }
      $('lembar').close();
      data = hasil.data;
      lubangBaru = unit;
      $('nama').value = rapikanNama($('nama').value);
      simpanNama();
      isiSaranNama();
      $('cari').value = '';
      tampilkanAbsen();
      window.scrollTo(0, 0);
      tampilkanPesan('Inspeksi unit ' + unit + ' tanggal ' + tanggalPanjang(tanggal) + ' tersimpan.');
    }).catch(function () {
      tampilkanSalah('Inspeksi belum tersimpan. Periksa sinyal, lalu tekan SUBMIT lagi.');
    }).then(function () {
      tombol.disabled = false;
      tombol.textContent = 'SUBMIT';
    });
  }

  function simpanNama() {
    try { localStorage.setItem(KUNCI_NAMA, $('nama').value); } catch (e) {}
  }

  function isiSaranNama() {
    var unik = {};
    data.records.forEach(function (r) { if (r.mech) unik[r.mech] = true; });
    var dl = $('daftarNama');
    dl.textContent = '';
    Object.keys(unik).sort().forEach(function (n) {
      var o = buat('option');
      o.value = n;
      dl.appendChild(o);
    });
  }

  function muat() {
    return panggil('getData').then(function (d) {
      data = d;
      $('subjudul').textContent = labelBulan(d.month) + ', target ' + d.target + 'x per unit';
      isiSaranNama();
      tampilkanAbsen();
    }).catch(function (err) {
      $('subjudul').textContent = 'Data gagal dimuat';
      var ul = $('daftarUnit');
      ul.textContent = '';
      ul.appendChild(kartuKosong((err && err.message) || 'Periksa sinyal, lalu buka ulang halaman ini.'));
    });
  }

  // ---------- Halaman display ----------
  /** Grup Non SET dan unit yang belum punya posisi tidak masuk persentase utama. */
  function posisiDihitung(nama) {
    return !!nama && !/^non[\s._-]*set$/i.test(String(nama).trim());
  }

  function masukHitungan(d, p) {
    if (!d.posisi || !d.posisi.length) return true;
    var pos = (d.posisiUnit || {})[p.unit] || '';
    return d.posisi.indexOf(pos) >= 0 && posisiDihitung(pos);
  }

  function judulKelompok(g) {
    var judul = buat('div');
    judul.appendChild(buat('h2', '', g.nama));
    if (!g.dihitung) judul.appendChild(buat('small', '', 'Tidak masuk persentase utama'));
    return judul;
  }

  function isiCapaian(d, semua, idUnit, idTeks, idBatang, idPersen) {
    semua = semua.filter(function (p) { return masukHitungan(d, p); });
    var tercapai = semua.filter(function (p) { return p.tercapai; }).length;
    var targetTotal = semua.length * d.target;
    var inspeksi = semua.reduce(function (n, p) { return n + Math.min(p.jumlah, d.target); }, 0);
    $(idUnit).textContent = tercapai + ' dari ' + semua.length + ' unit sudah ' + d.target + 'x';
    var teks = 'Inspeksi ' + inspeksi + ' dari ' + targetTotal;
    if (d.month === d.today.slice(0, 7)) {
      var akhir = new Date(Number(d.month.slice(0, 4)), Number(d.month.slice(5, 7)), 0).getDate();
      var sisa = akhir - hariBulan(d.today);
      teks += sisa > 0 ? ', sisa ' + sisa + ' hari' : ', hari terakhir bulan ini';
    }
    $(idTeks).textContent = teks;
    var persen = (targetTotal ? Math.round(inspeksi / targetTotal * 100) : 0) + '%';
    $(idBatang).style.width = persen;
    if (idPersen) $(idPersen).textContent = persen;
  }

  function tampilkanDisplay() {
    var d = dataDisplay;
    if (!d) return;
    var semua = ringkas(d);
    $('labelBulanDisp').textContent = labelBulan(d.month);
    $('bulanDepanDisp').disabled = d.month >= d.today.slice(0, 7);
    isiCapaian(d, semua, 'capaianUnitDisp', 'capaianInspeksiDisp', 'batangIsiDisp', 'persenDisp');

    var tampil = semua.filter(function (p) {
      return saringDisplay === 'semua' || (saringDisplay === 'tercapai' ? p.tercapai : !p.tercapai);
    });

    var ul = $('daftarDisplay');
    ul.textContent = '';
    kelompokPosisi(d, semua, false).forEach(function (g) {
      var isi = g.unit.filter(function (p) { return tampil.indexOf(p) >= 0; });
      if (!isi.length) return;
      var sudah = g.unit.reduce(function (n, p) { return n + Math.min(p.jumlah, d.target); }, 0);
      var li = buat('li', 'kelompok');
      var kepala = buat('div', 'kepala-kelompok');
      kepala.appendChild(judulKelompok(g));
      kepala.appendChild(buat('span', '', Math.round(sudah / (g.unit.length * d.target) * 100) + '%'));
      li.appendChild(kepala);
      var daftar = buat('ul', 'daftar');
      isi.forEach(function (p) { daftar.appendChild(barisDisplay(p, d)); });
      li.appendChild(daftar);
      ul.appendChild(li);
    });
    if (!tampil.length) {
      ul.appendChild(kartuKosong(saringDisplay === 'belum' ? 'Semua unit sudah mencapai target.' : 'Belum ada unit yang mencapai target.'));
    }
    var kini = new Date();
    $('diperbarui').textContent = 'Diperbarui pukul ' + String(kini.getHours()).padStart(2, '0') + '.' + String(kini.getMinutes()).padStart(2, '0');
  }

  // ---------- Bagikan display sebagai satu gambar ----------
  function teksRingkasan(d, semua) {
    var hitung = semua.filter(function (p) { return masukHitungan(d, p); });
    var target = hitung.length * d.target;
    var sudah = hitung.reduce(function (n, p) { return n + Math.min(p.jumlah, d.target); }, 0);
    var persen = target ? Math.round(sudah / target * 100) : 0;
    var baris = ['*Inspeksi Unit - ' + labelBulan(d.month) + '*',
      'Pencapaian ' + persen + '% (' + sudah + ' dari ' + target + ' inspeksi)', ''];
    kelompokPosisi(d, semua, false).forEach(function (g) {
      var s = g.unit.reduce(function (n, p) { return n + Math.min(p.jumlah, d.target); }, 0);
      baris.push(g.nama + ': ' + Math.round(s / (g.unit.length * d.target) * 100) + '%' + (g.dihitung ? '' : ' (tidak dihitung)'));
    });
    return { teks: captionBagikan(d), persen: persen, sudah: sudah, target: target, hitung: hitung };
  }

  /** Tanggal data: hari ini untuk bulan berjalan, tanggal terakhir untuk bulan yang sudah lewat. */
  function tanggalData(d) {
    if (d.month === d.today.slice(0, 7)) return d.today;
    var akhir = new Date(Number(d.month.slice(0, 4)), Number(d.month.slice(5, 7)), 0).getDate();
    return d.month + '-' + String(akhir).padStart(2, '0');
  }

  function captionBagikan(d) {
    var t = tanggalData(d);
    return 'Pencapaian Inspeksi Unit sampai dengan ' + tanggalPanjang(t) + ' ' + t.slice(0, 4) + '\nTerima kasih.';
  }

  function gambarDisplay(d) {
    var semua = ringkas(d);
    var r = teksRingkasan(d, semua);
    var grup = kelompokPosisi(d, semua, false);
    var W = 1080, P = 36, JARAK = 24, KOL = (W - P * 2 - JARAK) / 2;
    var TINGGI_BARIS = 58, SELA = 8, KEPALA = 52, CATATAN = 34, ANTAR_GRUP = 26;
    var JUDUL = 'bold 54px "Barlow Condensed", "Arial Narrow", Arial, sans-serif';
    var huruf = function (berat, ukuran, judul) {
      return berat + ' ' + ukuran + 'px ' + (judul ? '"Barlow Condensed", "Arial Narrow", Arial, sans-serif' : 'Barlow, Arial, sans-serif');
    };

    // Susun grup ke dua kolom, isi kolom yang lebih pendek lebih dulu.
    var tinggiKol = [0, 0], letak = [];
    grup.forEach(function (g) {
      var h = KEPALA + (g.dihitung ? 0 : CATATAN) + g.unit.length * (TINGGI_BARIS + SELA);
      var k = tinggiKol[0] <= tinggiKol[1] ? 0 : 1;
      letak.push({ g: g, kol: k, y: tinggiKol[k] });
      tinggiKol[k] += h + ANTAR_GRUP;
    });
    var ATAS_GRUP = 150 + 18 + 210 + 34;
    var H = ATAS_GRUP + Math.max(tinggiKol[0], tinggiKol[1]) + 60;

    var kanvas = document.createElement('canvas');
    kanvas.width = W; kanvas.height = H;
    var c = kanvas.getContext('2d');
    c.fillStyle = '#E4E8EB'; c.fillRect(0, 0, W, H);

    // Kepala kuning dan garis peringatan
    c.fillStyle = '#F6B800'; c.fillRect(0, 0, W, 150);
    c.fillStyle = '#23262A';
    c.font = JUDUL; c.textBaseline = 'alphabetic';
    c.fillText('Inspeksi Unit', P, 72);
    c.font = huruf(600, 30, false);
    c.fillText('Display inspeksi · ' + labelBulan(d.month), P, 118);
    c.fillRect(0, 150, W, 18);
    c.fillStyle = '#F6B800';
    for (var x = -20; x < W + 20; x += 44) {
      c.beginPath(); c.moveTo(x, 168); c.lineTo(x + 18, 150); c.lineTo(x + 36, 150); c.lineTo(x + 18, 168); c.fill();
    }
    var logo = [$('logoGsi'), $('logoBaramulti')].filter(function (im) { return im && im.complete && im.naturalWidth; });
    if (logo.length) {
      var TL = 92, SELA_L = 18, PAD_L = 14;
      var lebarL = logo.reduce(function (n, im) { return n + im.naturalWidth * TL / im.naturalHeight; }, 0) + SELA_L * (logo.length - 1);
      var xL = W - P - lebarL - PAD_L * 2;
      kotak(c, xL, 75 - TL / 2 - PAD_L, lebarL + PAD_L * 2, TL + PAD_L * 2, 12, '#FFFFFF');
      xL += PAD_L;
      logo.forEach(function (im) {
        var lw = im.naturalWidth * TL / im.naturalHeight;
        c.drawImage(im, xL, 75 - TL / 2, lw, TL);
        xL += lw + SELA_L;
      });
    }

    // Kotak pencapaian
    var yK = 168 + 24;
    kotak(c, P, yK, W - P * 2, 200, 10, '#23262A');
    c.fillStyle = '#F6B800'; c.font = huruf(700, 120, true);
    c.fillText(r.persen + '%', P + 28, yK + 128);
    var xT = P + 28 + Math.max(250, c.measureText(r.persen + '%').width + 36);
    var tercapai = r.hitung.filter(function (p) { return p.tercapai; }).length;
    c.fillStyle = '#FFFFFF'; c.font = huruf(700, 40, true);
    c.fillText(tercapai + ' dari ' + r.hitung.length + ' unit sudah ' + d.target + 'x', xT, yK + 72);
    c.fillStyle = '#D5D9DD'; c.font = huruf(500, 28, false);
    c.fillText('Inspeksi ' + r.sudah + ' dari ' + r.target, xT, yK + 116);
    kotak(c, P + 28, yK + 160, W - P * 2 - 56, 14, 7, '#474C52');
    if (r.persen) kotak(c, P + 28, yK + 160, Math.max(14, (W - P * 2 - 56) * Math.min(r.persen, 100) / 100), 14, 7, '#F6B800');

    // Grup
    letak.forEach(function (l) {
      var g = l.g, x0 = P + l.kol * (KOL + JARAK), y = ATAS_GRUP + l.y;
      var s = g.unit.reduce(function (n, p) { return n + Math.min(p.jumlah, d.target); }, 0);
      c.fillStyle = '#23262A'; c.font = huruf(700, 34, true);
      c.textAlign = 'left'; c.fillText(potong(c, g.nama, KOL - 90), x0 + 2, y + 36);
      c.textAlign = 'right'; c.fillText(Math.round(s / (g.unit.length * d.target) * 100) + '%', x0 + KOL - 2, y + 36);
      c.textAlign = 'left';
      y += KEPALA;
      if (!g.dihitung) {
        c.fillStyle = '#565E66'; c.font = huruf(500, 20, false);
        c.fillText('Tidak masuk persentase utama', x0 + 2, y + 16);
        y += CATATAN;
      }
      g.unit.forEach(function (p) {
        var tgl = Object.keys(p.tanggal).sort().map(hariBulan);
        kotak(c, x0, y, KOL, TINGGI_BARIS, 8, '#FFFFFF');
        kotak(c, x0, y, 7, TINGGI_BARIS, 3, p.tercapai ? '#0B7A4B' : '#C3CAD0');
        c.fillStyle = '#23262A'; c.font = huruf(700, 34, true);
        c.fillText(p.unit, x0 + 20, y + 41);
        for (var i = 0; i < d.target; i++) {
          var cx = x0 + 128 + i * 50, cy = y + TINGGI_BARIS / 2;
          c.beginPath(); c.arc(cx, cy, 20, 0, Math.PI * 2);
          if (i < tgl.length) {
            c.fillStyle = p.tercapai ? '#0B7A4B' : '#23262A'; c.fill();
            c.fillStyle = '#FFFFFF'; c.font = huruf(700, 22, true); c.textAlign = 'center';
            c.fillText(String(tgl[i]), cx, cy + 8); c.textAlign = 'left';
          } else {
            c.setLineDash([5, 4]); c.strokeStyle = '#8A939B'; c.lineWidth = 2; c.stroke(); c.setLineDash([]);
          }
        }
        if (p.jumlah > d.target) {
          c.fillStyle = '#0B7A4B'; c.font = huruf(700, 22, true);
          c.fillText('+' + (p.jumlah - d.target), x0 + 128 + d.target * 50 - 10, y + 37);
        }
        c.fillStyle = p.tercapai ? '#0B7A4B' : '#565E66'; c.font = huruf(600, 22, false);
        c.textAlign = 'right';
        c.fillText(p.tercapai ? 'Selesai' : 'Sisa ' + (d.target - p.jumlah), x0 + KOL - 14, y + 37);
        c.textAlign = 'left';
        y += TINGGI_BARIS + SELA;
      });
    });

    // Kaki
    var kini = new Date();
    c.fillStyle = '#565E66'; c.font = huruf(500, 22, false);
    c.fillText('Angka di lingkaran = tanggal inspeksi · Dibuat ' + kini.getDate() + ' ' + labelBulan(d.today.slice(0, 7)) +
      ' pukul ' + String(kini.getHours()).padStart(2, '0') + '.' + String(kini.getMinutes()).padStart(2, '0'), P, H - 24);
    return { kanvas: kanvas, teks: r.teks };
  }

  function kotak(c, x, y, w, h, r, warna) {
    c.fillStyle = warna;
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fill();
  }

  function potong(c, s, lebar) {
    if (c.measureText(s).width <= lebar) return s;
    while (s.length > 1 && c.measureText(s + '…').width > lebar) s = s.slice(0, -1);
    return s + '…';
  }

  /** Tombol bagikan ada di Admin, tetapi gambarnya sama dengan tampilan Display. */
  function bagikanGambar() {
    var d = dataAdmin;
    if (!d) return;
    var tombol = $('bagikanAdmin');
    tombol.disabled = true;
    // Caption disalin langsung saat tombol ditekan, lalu ditempel di kolom keterangan gambar di WA.
    var caption = captionBagikan(d);
    var tersalin = navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(caption).then(function () { return true; }, function () { return false; })
      : Promise.resolve(false);
    tersalin.then(function (ok) {
      if (ok) tampilkanPesan('Caption sudah disalin. Di WA, tempel di kolom keterangan gambar sebelum kirim.');
    });
    var siap = document.fonts && document.fonts.load ? Promise.all([
      document.fonts.load('700 40px "Barlow Condensed"'), document.fonts.load('500 28px Barlow'), document.fonts.load('600 22px Barlow')
    ]).catch(function () {}) : Promise.resolve();
    siap = siap.then(function () {
      return Promise.all([$('logoGsi'), $('logoBaramulti')].map(function (im) {
        return im && im.decode ? im.decode().catch(function () {}) : null;
      }));
    });
    siap.then(function () {
      var hasil = gambarDisplay(d);
      return new Promise(function (ok) { hasil.kanvas.toBlob(function (b) { ok({ blob: b, teks: hasil.teks }); }, 'image/png'); });
    }).then(function (h) {
      var nama = 'Inspeksi Unit ' + labelBulan(d.month) + '.png';
      var berkas = typeof File === 'function' ? new File([h.blob], nama, { type: 'image/png' }) : null;
      if (berkas && navigator.canShare && navigator.canShare({ files: [berkas] })) {
        return navigator.share({ files: [berkas], title: caption.split('\n')[0] })
          .catch(function (e) { if (e && e.name !== 'AbortError') unduhGambar(h.blob, nama, tersalin); });
      }
      unduhGambar(h.blob, nama, tersalin);
    }).catch(function () {
      tampilkanPesan('Gambar gagal dibuat. Coba lagi.', true);
    }).then(function () { tombol.disabled = false; });
  }

  function unduhGambar(blob, nama, tersalin) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nama;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    (tersalin || Promise.resolve(false)).then(function (ok) {
      tampilkanPesan(ok ? 'Gambar tersimpan dan caption sudah disalin. Tempel caption saat mengirim gambar.'
        : 'Gambar tersimpan. Kirim gambar itu ke WA atau email.');
    });
  }

  /** Mengelompokkan unit sesuai sheet Posisi. Unit tanpa posisi tampil paling akhir. */
  function kelompokPosisi(d, semua, sertakanKosong) {
    var daftar = d.posisi.map(function (n) { return { kunci: n, nama: n, unit: [], dihitung: posisiDihitung(n) }; });
    var tanpa = { kunci: '', nama: 'Belum ada posisi', unit: [], dihitung: false };
    semua.forEach(function (p) {
      var g = daftar.filter(function (x) { return x.kunci === d.posisiUnit[p.unit]; })[0] || tanpa;
      g.unit.push(p);
    });
    return daftar.concat(tanpa).filter(function (g) {
      g.unit.sort(function (a, b) { return urutKode(a.unit, b.unit); });
      return g.unit.length || (sertakanKosong && g.kunci);
    });
  }

  function barisDisplay(p, d) {
    var tgl = Object.keys(p.tanggal).sort().map(hariBulan);
    var li = buat('li', p.tercapai ? 'baris-unit tercapai' : 'baris-unit');
    li.appendChild(buat('span', 'kode', p.unit));
    var slot = buat('span', 'slot');
    slot.setAttribute('role', 'img');
    slot.setAttribute('aria-label', tgl.length ? 'Inspeksi tanggal ' + tgl.join(', ') : 'Belum diinspeksi');
    for (var i = 0; i < d.target; i++) slot.appendChild(buat('b', i < tgl.length ? 'isi' : '', i < tgl.length ? tgl[i] : ''));
    if (p.jumlah > d.target) slot.appendChild(buat('span', 'lebih', '+' + (p.jumlah - d.target)));
    li.appendChild(slot);
    li.appendChild(buat('span', 'status-unit', p.tercapai ? 'Selesai' : 'Sisa ' + (d.target - p.jumlah)));
    return li;
  }

    $('salahAdmin').textContent = teks;

    dataAdmin = h.data;

  function bukaBulan(b) {

    $('labelBulan').textContent = labelBulan(b);
    panggil('getAdminData', { password: password, bulan: b }).then(function (h) {
      if (bulanAdmin !== b) return;
      if (!h.ok) { tampilkanPesan(h.message, true); return; }
      terimaAdmin(h);
    }).catch(function () {
      tampilkanPesan('Data gagal dimuat. Periksa sinyal lalu coba lagi.', true);
    });
  }

  function tampilkanRekap() {
    var d = dataAdmin;
    if (!d) return;
    var semua = ringkas(d);
    $('labelBulan').textContent = labelBulan(d.month);
    $('bulanDepan').disabled = d.month >= d.today.slice(0, 7);
    isiCapaian(d, semua, 'capaianUnit', 'capaianInspeksi', 'batangIsi');

    var tampil = semua.filter(function (p) {
      return saring === 'semua' || (saring === 'tercapai' ? p.tercapai : !p.tercapai);
    }).sort(function (a, b) { return (a.jumlah - b.jumlah) || urutKode(a.unit, b.unit); });

    var ul = $('daftarRekap');
    ul.textContent = '';
    tampil.forEach(function (p) {
      var li = buat('li');
      var det = buat('details', 'kartu');
      if (p.tercapai) det.classList.add('tercapai');
      var sum = buat('summary');
      sum.appendChild(buat('span', 'kode', p.unit));
      sum.appendChild(buatLubang(p, d.target));

      var tgl = Object.keys(p.tanggal).sort().map(hariBulan);
      var ket = tgl.length ? 'Tanggal ' + tgl.join(', ') : 'Belum diinspeksi bulan ini';
      sum.appendChild(buat('span', 'ket', ket));
      det.appendChild(sum);

      if (p.baris.length) {
        var rinci = buat('ul', 'rincian');
        p.baris.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
          .forEach(function (r) {
            var b = buat('li');
            b.appendChild(buat('b', '', tanggalPanjang(r.date) + (r.mech ? ', ' + r.mech : '')));
            b.appendChild(buat('small', '', 'HM ' + (r.hm || 'tidak diisi')));
            if (r.note) b.appendChild(buat('small', '', r.note));
            rinci.appendChild(b);
          });
        det.appendChild(rinci);
      }
      li.appendChild(det);
      ul.appendChild(li);
    });
    if (!tampil.length) {
      ul.appendChild(kartuKosong(saring === 'belum' ? 'Semua unit sudah mencapai target.' : 'Belum ada unit yang mencapai target.'));
    }

    var per = {};
    d.records.forEach(function (r) { var n = r.mech || 'Nama belum diisi'; per[n] = (per[n] || 0) + 1; });
    var orang = Object.keys(per).sort(function (a, b) { return per[b] - per[a] || a.localeCompare(b, 'id'); });
    var uo = $('daftarOrang');
    uo.textContent = '';
    orang.forEach(function (n) {
      var li = buat('li', 'orang');
      li.appendChild(buat('b', '', n));
      li.appendChild(buat('span', '', per[n] + ' inspeksi'));
      uo.appendChild(li);
    });
    if (!orang.length) uo.appendChild(kartuKosong('Belum ada inspeksi di bulan ini.'));
  }

  function tampilkanDatabase() {
    var d = dataAdmin;
    if (!d) return;
    var kata = $('cariData').value.trim().toLowerCase();
    var isi = d.records.filter(function (r) {
      return !kata || [r.unit, r.mech, r.note, r.date].join(' ').toLowerCase().indexOf(kata) >= 0;
    }).sort(function (a, b) {
      var x = b.date + b.time, y = a.date + a.time;
      return x < y ? -1 : x > y ? 1 : 0;
    });

    $('jumlahData').textContent = isi.length + ' inspeksi';
    var ul = $('daftarData');
    ul.textContent = '';
    isi.forEach(function (r) {
      var li = buat('li', 'baris');
      var atas = buat('div', 'baris-atas');
      atas.appendChild(buat('span', 'kode', r.unit));
      atas.appendChild(buat('time', '', tanggalPanjang(r.date)));
      li.appendChild(atas);
      li.appendChild(buat('p', 'nama', r.mech || 'Nama belum diisi'));
      if (r.inputDate) li.appendChild(buat('p', 'kecil', 'Diinput ' + tanggalPanjang(r.inputDate) + (r.time ? ', ' + r.time : '')));
      li.appendChild(buat('p', 'kecil', 'HM ' + (r.hm || 'tidak diisi')));
      if (r.note) li.appendChild(buat('p', 'kecil', r.note));
      li.appendChild(buatAksi(r));
      ul.appendChild(li);
    });
    if (!isi.length) ul.appendChild(kartuKosong(kata ? 'Tidak ada inspeksi yang cocok.' : 'Belum ada inspeksi di bulan ini.'));
  }

  /** Tombol Edit dan Hapus di baris yang sama. */
  function buatAksi(r) {
    var aksi = buat('div', 'aksi');
    var label = 'unit ' + r.unit + ' tanggal ' + tanggalPanjang(r.date);

    function tanya() {
      aksi.textContent = '';
      aksi.appendChild(buat('span', '', 'Hapus inspeksi ini?'));
      var ya = buat('button', 'yakin', 'Ya, hapus');
      var batal = buat('button', '', 'Batal');
      ya.type = batal.type = 'button';
      batal.addEventListener('click', awal);
      ya.addEventListener('click', function () {
        ya.disabled = batal.disabled = true;
        ya.textContent = 'Menghapus…';
        panggil('hapusInspeksi', {
          password: password, row: r.row, unit: r.unit, date: r.date, mech: r.mech, bulan: bulanAdmin
        }).then(function (h) {
          if (!h.ok) { tampilkanPesan(h.message, true); bukaBulan(bulanAdmin); return; }
          terimaAdmin(h);
          tampilkanPesan('Inspeksi ' + label + ' dihapus.');
        }).catch(function () {
          tampilkanPesan('Data belum terhapus. Periksa sinyal lalu coba lagi.', true);
          awal();
        });
      });
      aksi.appendChild(ya);
      aksi.appendChild(batal);
      batal.focus();
    }

    function bukaEdit() {
      aksi.textContent = '';
      var f = buat('form', 'form-edit');
      f.noValidate = true;

      function ruas(judul, el) {
        var l = buat('label', 'label', judul);
        l.appendChild(el);
        f.appendChild(l);
        return el;
      }

      var tanggal = ruas('Tanggal inspeksi', buat('input'));
      tanggal.type = 'date';
      tanggal.max = dataAdmin.today;
      tanggal.value = r.date;

      var unit = ruas('Unit', buat('select'));
      var pilihan = dataAdmin.units.indexOf(r.unit) < 0 ? [r.unit].concat(dataAdmin.units) : dataAdmin.units;
      pilihan.slice().sort(urutKode).forEach(function (u) {
        var o = buat('option', '', u);
        o.value = u;
        unit.appendChild(o);
      });
      unit.value = r.unit;

      var nama = ruas('Nama mekanik', buat('input'));
      nama.type = 'text';
      nama.maxLength = 60;
      nama.value = r.mech;

      var hm = ruas('HM unit', buat('input'));
      hm.inputMode = 'decimal';
      hm.value = r.hm;

      var catatan = ruas('Catatan', buat('textarea'));
      catatan.maxLength = 500;
      catatan.value = r.note;

      var salah = buat('p', 'salah');
      salah.setAttribute('role', 'alert');
      salah.hidden = true;
      f.appendChild(salah);

      var tombol = buat('div', 'tombol-edit');
      var simpan = buat('button', 'simpan', 'Simpan perubahan');
      var batal = buat('button', '', 'Batal');
      simpan.type = 'submit';
      batal.type = 'button';
      batal.addEventListener('click', awal);
      tombol.appendChild(simpan);
      tombol.appendChild(batal);
      f.appendChild(tombol);

      f.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!tanggal.value) { salah.textContent = 'Pilih tanggal inspeksi.'; salah.hidden = false; return; }
        simpan.disabled = batal.disabled = true;
        simpan.textContent = 'Menyimpan…';
        salah.hidden = true;
        panggil('editInspeksi', {
          password: password, row: r.row, unit: r.unit, date: r.date, mech: r.mech, bulan: bulanAdmin,
          baru: { tanggal: tanggal.value, unit: unit.value, mekanik: nama.value, hm: hm.value.trim(), catatan: catatan.value }
        }).then(function (h) {
          if (!h.ok) {
            salah.textContent = h.message;
            salah.hidden = false;
            simpan.disabled = batal.disabled = false;
            simpan.textContent = 'Simpan perubahan';
            return;
          }
          terimaAdmin(h);
          tampilkanPesan('Inspeksi unit ' + unit.value + ' diperbarui.');
        }).catch(function () {
          salah.textContent = 'Perubahan belum tersimpan. Periksa sinyal lalu coba lagi.';
          salah.hidden = false;
          simpan.disabled = batal.disabled = false;
          simpan.textContent = 'Simpan perubahan';
        });
      });

      aksi.appendChild(f);
      nama.focus();
    }

    function awal() {
      aksi.textContent = '';
      var edit = buat('button', '', 'Edit');
      edit.type = 'button';
      edit.setAttribute('aria-label', 'Edit inspeksi ' + label);
      edit.addEventListener('click', bukaEdit);
      aksi.appendChild(edit);
      var hapus = buat('button', 'hapus', 'Hapus');
      hapus.type = 'button';
      hapus.setAttribute('aria-label', 'Hapus inspeksi ' + label);
      hapus.addEventListener('click', tanya);
      aksi.appendChild(hapus);
    }

    awal();
    return aksi;
  }

  // ---------- Posisi unit (admin) ----------
  function tampilkanPosisi() {
    var d = dataAdmin;
    if (!d) return;
    var kotak = $('daftarPosisi');
    kotak.textContent = '';
    kelompokPosisi(d, ringkas(d), true).forEach(function (g) {
      var bagian = buat('section', 'kelompok-admin');
      var kepala = buat('div', 'kepala-kelompok');
      kepala.appendChild(judulKelompok(g));
      if (g.unit.length) {
        kepala.appendChild(buat('span', '', g.unit.length + ' unit'));
      } else {
        var hapus = buat('button', 'hapus-posisi', 'Hapus posisi');
        hapus.type = 'button';
        hapus.addEventListener('click', function () {
          hapus.disabled = true;
          ubahPosisi('hapusPosisi', { nama: g.kunci }, 'Posisi ' + g.nama + ' dihapus.');
        });
        kepala.appendChild(hapus);
      }
      bagian.appendChild(kepala);

      var ul = buat('ul', 'daftar');
      g.unit.forEach(function (p) {
        var li = buat('li', 'baris-posisi');
        li.appendChild(buat('span', 'kode', p.unit));
        var pilih = buat('select');
        pilih.setAttribute('aria-label', 'Posisi unit ' + p.unit);
        d.posisi.concat('').forEach(function (n) {
          var o = buat('option', '', n || 'Belum ada posisi');
          o.value = n;
          pilih.appendChild(o);
        });
        pilih.value = g.kunci;
        pilih.addEventListener('change', function () {
          pilih.disabled = true;
          ubahPosisi('simpanPosisi', { unit: p.unit, posisi: pilih.value },
            p.unit + ' dipindah ke ' + (pilih.value || 'Belum ada posisi') + '.');
        });
        li.appendChild(pilih);
        ul.appendChild(li);
      });
      bagian.appendChild(ul);
      kotak.appendChild(bagian);
    });
  }

  function ubahPosisi(fungsi, isi, teksBerhasil) {
    isi.password = password;
    isi.bulan = bulanAdmin;
    return panggil(fungsi, isi).then(function (h) {
      if (!h.ok) { tampilkanPesan(h.message, true); tampilkanPosisi(); return false; }
      terimaAdmin(h);
      tampilkanPesan(teksBerhasil);
      return true;
    }).catch(function () {
      tampilkanPesan('Perubahan belum tersimpan. Periksa sinyal lalu coba lagi.', true);
      tampilkanPosisi();
      return false;
    });
  }

  function gantiTab(tab) {
    document.querySelectorAll('#navAdmin button').forEach(function (b) {
      if (b.getAttribute('data-tab') === tab) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    $('tabRekap').hidden = tab !== 'rekap';
    $('tabDatabase').hidden = tab !== 'database';
    $('tabPosisi').hidden = tab !== 'posisi';
    $('navBulan').hidden = tab === 'posisi';
    $('pesan').hidden = true;
    window.scrollTo(0, 0);
  }

  function salinLink() {
    var teks = $('linkApp').textContent;
    function gagal() { tampilkanPesan('Salin gagal. Tekan lama link di atas untuk menyalin.', true); }
    if (!navigator.clipboard) { gagal(); return; }
    navigator.clipboard.writeText(teks).then(function () { tampilkanPesan('Link tersalin.'); }, gagal);
  }

  // ---------- Umum ----------
  function tampilkanPesan(teks, gagal) {
    var p = $('pesan');
    p.textContent = teks;
    p.classList.toggle('gagal', !!gagal);
    p.hidden = false;
    clearTimeout(timerPesan);
    timerPesan = setTimeout(function () { p.hidden = true; }, 3500);
  }

  function aturMode(mode) {
    var admin = mode === 'admin';
    modeTampil = mode;
    modeAdmin = admin;
    var display = lihatDisplay();
    var input = mode === 'mekanik';
    $('pesan').hidden = true;
    $('pilihNama').hidden = !input;
    $('tabAbsen').hidden = !input;
    $('tabDisplay').hidden = !display;
    document.body.classList.toggle('modeLebar', display);
    $('masukAdmin').hidden = !admin || !!password;
    $('panelAdmin').hidden = !admin || !password;
    $('navAdmin').hidden = !admin || !password;
    document.body.classList.toggle('adaNav', admin && !!password);
    $('gantiContoh').textContent = admin ? 'Lihat halaman mekanik' : 'Lihat halaman admin';
    if (admin) {
      $('subjudul').textContent = 'Admin';
      if (DEMO && !password) {
        $('password').value = 'contoh';
      }
    } else if (display) {
      $('subjudul').textContent = 'Display inspeksi';
      bukaDisplay(bulanDisplay);

  $('cari').addEventListener('input', tampilkanAbsen);

  // Display memperbarui diri tiap 30 detik, cocok untuk layar yang dibiarkan menyala.

    if (lihatDisplay() && document.visibilityState === 'visible') bukaDisplay(bulanDisplay);

      { time: '14:15', date: tgl(3), unit: 'D31', mech: 'Mekanik A', hm: '6104', note: '' }
    ];
    var posisi = ['SET 2', 'SET 3', 'SET 4', 'SET 5', 'SET 1 Tarakan', 'SET 2 Tarakan', 'FC. VANGUARD', 'FC. ALPHA', 'FC. DAYSPRING', 'FC. AVANT GARDE', 'Non SET'];
    var posisiUnit = { D42: 'SET 2', D51: 'SET 2', D61: 'SET 2', L55: 'SET 2', D39: 'SET 3', D49: 'SET 3', D59: 'SET 3', L52: 'SET 3', D56: 'SET 4', D57: 'SET 4', D60: 'SET 4', L54: 'SET 4', D45: 'SET 5', D50: 'SET 5', D58: 'SET 5', L53: 'SET 5', D15: 'SET 1 Tarakan', D47: 'SET 1 Tarakan', D48: 'SET 1 Tarakan', L43: 'SET 1 Tarakan', D04: 'SET 2 Tarakan', D14: 'SET 2 Tarakan', D35: 'SET 2 Tarakan', L16: 'SET 2 Tarakan', D28: 'FC. VANGUARD', D40: 'FC. VANGUARD', L36: 'FC. VANGUARD', D13: 'FC. ALPHA', D21: 'FC. ALPHA', L37: 'FC. ALPHA', D10: 'FC. DAYSPRING', D12: 'FC. DAYSPRING', L38: 'FC. DAYSPRING', D09: 'FC. AVANT GARDE', D33: 'FC. AVANT GARDE', L44: 'FC. AVANT GARDE', D23: 'Non SET', D24: 'Non SET', D31: 'Non SET', D41: 'Non SET', L46: 'Non SET' };
    function bulan(b) {
      var m = b || bulanIni;
      return {
        today: today, minDate: bulanIni + '-01', month: m, target: 3, requireHm: true, units: units,
        posisi: posisi, posisiUnit: posisiUnit,
        records: records.filter(function (r) { return r.date.slice(0, 7) === m; })
      };
    }
    function hasilAdmin(i) {
      return { ok: true, data: bulan(i.bulan), sheetUrl: 'https://docs.google.com/spreadsheets/', appUrl: 'Link muncul di sini setelah aplikasi dipasang' };
    }
    return {
      getData: function (b) { return bulan(b); },
      submitAbsen: function (i) {
        var nama = rapikanNama(i.mekanik);
        if (records.some(function (r) { return r.date === i.tanggal && r.unit === i.unit && r.mech === nama; })) {
          return { ok: false, message: 'Anda sudah input inspeksi unit ' + i.unit + ' pada tanggal itu.' };
        }
        records.push({ time: '07:00', inputDate: today, date: i.tanggal, unit: i.unit, mech: nama, hm: String(i.hm), note: i.catatan });
        return { ok: true, data: bulan() };
      },
      simpanPosisi: function (i) { posisiUnit[i.unit] = i.posisi; return hasilAdmin(i); },
      tambahPosisi: function (i) { posisi.push(i.nama); return hasilAdmin(i); },
      hapusPosisi: function (i) { posisi = posisi.filter(function (n) { return n !== i.nama; }); return hasilAdmin(i); },
      editInspeksi: function (i) {
        records.forEach(function (r) {
          if (r.date === i.date && r.unit === i.unit && r.mech === i.mech) {
            r.date = i.baru.tanggal; r.unit = i.baru.unit; r.mech = rapikanNama(i.baru.mekanik); r.hm = i.baru.hm; r.note = i.baru.catatan;
          }
        });
        return { ok: true, data: bulan(i.bulan), sheetUrl: 'https://docs.google.com/spreadsheets/', appUrl: 'Link muncul di sini setelah aplikasi dipasang' };
      },
      hapusInspeksi: function (i) {
        records = records.filter(function (r) { return !(r.date === i.date && r.unit === i.unit && r.mech === i.mech); });
        return { ok: true, data: bulan(i.bulan), sheetUrl: 'https://docs.google.com/spreadsheets/', appUrl: 'Link muncul di sini setelah aplikasi dipasang' };
      },
      getAdminData: function (i) {
        if (i.password !== 'contoh') return { ok: false, message: 'Password salah. Lihat sheet Pengaturan, sel B1.' };
        return { ok: true, data: bulan(i.bulan), sheetUrl: 'https://docs.google.com/spreadsheets/', appUrl: 'Link muncul di sini setelah aplikasi dipasang' };
      }
    };
  })();

  // ---------- Mulai ----------
  try { $('nama').value = localStorage.getItem(KUNCI_NAMA) || ''; } catch (e) {}
  if (DEMO) {
    $('demo').hidden = false;
    aturMode(location.hash === '#admin' ? 'admin' : location.hash === '#display' ? 'display' : 'mekanik');
  } else if (!PAKAI_GOOGLE) {
    var q = new URLSearchParams(location.search);
    aturMode(q.has('admin') ? 'admin' : q.has('display') ? 'display' : 'mekanik');
  } else {
    google.script.url.getLocation(function (lokasi) {
      var p = lokasi.parameter || {};
      aturMode('admin' in p ? 'admin' : 'display' in p ? 'display' : 'mekanik');
    });
  }
})();
</script>
